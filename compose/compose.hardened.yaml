# Hardened version of the same stack.
# Rule: the internet sees ports 80/443 on nginx — nothing else.
# Everything else lives on a private Docker network with resource ceilings.
name: vibestack-hardened

networks:
  edge:      # nginx <-> web
  internal:  # web <-> ollama / mongo / redis — no published ports

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"                  # the ONLY doors the internet can see
    volumes:
      - ../nginx/nginx.hardened.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    mem_limit: 128m
    pids_limit: 100
    depends_on: [web]

  web:
    image: node:22-alpine          # patched framework version in real life
    command: ["node", "server.js"]
    expose:
      - "3000"                     # reachable by nginx, never published
    networks: [edge, internal]
    mem_limit: 512m                # a compromised container starves itself,
    cpus: 1.0                      # not its neighbors — no host-wide OOM
    pids_limit: 100                # a flood cannot spawn 7,000 processes
    read_only: true                # no payload written to disk
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    environment:
      OLLAMA_URL: http://ollama:11434
      MONGO_URL: mongodb://mongo:27017/app
      REDIS_URL: redis://redis:6379
    depends_on: [ollama, mongo, redis]

  ollama:
    image: ollama/ollama:0.6.8
    expose:
      - "11434"                    # internal only — bots cannot reach it
    networks: [internal]
    mem_limit: 4g
    pids_limit: 200

  mongo:
    image: mongo:8.0
    expose:
      - "27017"                    # internal only
    networks: [internal]
    mem_limit: 1g
    pids_limit: 200
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.4-alpine
    expose:
      - "6379"                     # internal only
    networks: [internal]
    mem_limit: 256m
    pids_limit: 100

volumes:
  mongo-data:
