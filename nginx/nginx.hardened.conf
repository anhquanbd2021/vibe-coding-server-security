# Hardened edge — the only public door into the stack.
# Mount into nginx: /etc/nginx/conf.d/default.conf

limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

upstream web_app {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # CVE-2025-29927: a forged x-middleware-subrequest header must never
    # reach Next.js — reject it at the edge, and strip it defensively
    # on any request that does get proxied.
    if ($http_x_middleware_subrequest) {
        return 403;
    }
    proxy_set_header x-middleware-subrequest "";

    # Bots probing for secrets, configs, and backups get nothing.
    location ~* /\.(env|git|ssh|aws|npm|config|docker|svn|hg) {
        return 404;
    }

    # Known scanner user-agents are not welcome.
    if ($http_user_agent ~* "(masscan|zgrab|zmap|nmap|sqlmap|nikto|acunetix|nuclei)") {
        return 403;
    }

    location / {
        limit_req  zone=perip burst=20 nodelay;
        limit_conn addr 20;

        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 1m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
